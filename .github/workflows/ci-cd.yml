name: CI

# Este proyecto no tiene despliegue configurado en Render todavía, así que ese alcance sigue
# fuera de este workflow. Sí tiene lint (ESLint en ambos paquetes), suite de tests real
# (Vitest en ecommerce-api, Jest+RTL en ecommerce-app) y specs E2E con Cypress en
# ecommerce-app/cypress — corren en los jobs test-api, test-app y e2e de abajo.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-api:
    name: Test API (ecommerce-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommerce-api/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest + mongodb-memory-server: no necesita un Mongo real ni MONGO_URI en CI,
      # cada test levanta su propia instancia en memoria (ver tests/integration/helpers/db.js).
      - name: Tests unitarios + integración con cobertura
        run: npm run test:coverage

  test-app:
    name: Test + build App (ecommerce-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommerce-app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # CI=true hace que react-scripts corra Jest una sola vez (sin watch) y trate los
      # warnings de ESLint del build como errores.
      - name: Tests unitarios con cobertura
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Build de producción
        run: npm run build
        env:
          CI: true

  e2e:
    name: E2E con Cypress (headless)
    runs-on: ubuntu-latest
    needs: [test-api, test-app]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommerce-api/package-lock.json

      # No se usa el bloque "services:" para Mongo porque GitHub Actions no deja pasarle
      # --replSet al contenedor ahí (solo admite image/env/ports/options de docker
      # create, no argumentos al proceso mongod) — y order.controller.js (createOrder)
      # usa una transacción real (B-23), que un Mongo standalone rechaza directo
      # ("Transaction numbers are only allowed on a replica set member"). Se levanta a
      # mano como replica set de 1 nodo, mismo motivo por el que
      # tests/integration/helpers/db.js usa MongoMemoryReplSet en vez de MongoMemoryServer.
      - name: Levantar MongoDB como replica set de 1 nodo
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 30); do
            state=$(docker exec mongo mongosh --quiet --eval "rs.status().myState" 2>/dev/null)
            [ "$state" = "1" ] && break
            sleep 2
          done

      - name: Instalar dependencias de la API
        working-directory: ecommerce-api
        run: npm ci

      # user4@test.com / 123456 (password del seed) es el usuario de prueba por defecto
      # que usa cy.loginByApi() — ver ecommerce-app/cypress.config.js. Las env vars de la API
      # (incluido PORT) van SOLO en estos dos pasos — a nivel de job se filtrarían también al
      # "npm start" del frontend de más abajo y le pisarían su propio puerto (bug real ya visto
      # en un run de CI: el frontend intentó levantar en :4001 en vez de :3001).
      - name: Sembrar datos de prueba
        working-directory: ecommerce-api
        run: npm run seed
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/osshirt_e2e?replicaSet=rs0

      - name: Levantar la API en background
        working-directory: ecommerce-api
        run: npm start &
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/osshirt_e2e?replicaSet=rs0
          JWT_SECRET: e2e-ci-jwt-secret
          JWT_REFRESH_SECRET: e2e-ci-jwt-refresh-secret
          JWT_EXPIRES_IN: 1h
          JWT_REFRESH_EXPIRES_IN: 7d
          PORT: 4001
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001

      # ecommerce-app/.env (que fija PORT=3001) está en .gitignore y no existe en el checkout
      # de CI — sin PORT explícito, react-scripts arranca en su default (3000), y wait-on se
      # queda esperando :3001 para siempre (confirmado en un run real: "webpack compiled
      # successfully" en el puerto 3000, seguido de ECONNREFUSED en 127.0.0.1:3001). 127.0.0.1
      # en vez de "localhost" evita además cualquier ambigüedad de resolución IPv4/IPv6 en
      # runners Ubuntu, aunque el problema real era el puerto, no el host.
      - name: Instalar, levantar frontend y correr specs de Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: ecommerce-app
          install-command: npm ci
          start: npm start
          wait-on: "http://127.0.0.1:4001, http://127.0.0.1:3001"
          wait-on-timeout: 120
        env:
          CI: true
          PORT: 3001
          CYPRESS_BASE_URL: http://127.0.0.1:3001
          CYPRESS_API_URL: http://127.0.0.1:4001/api

      - name: Subir video/screenshots si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            ecommerce-app/cypress/videos
            ecommerce-app/cypress/screenshots
          if-no-files-found: ignore
