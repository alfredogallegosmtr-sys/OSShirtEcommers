name: CI

# Versión reducida: este proyecto todavía no tiene ESLint/Prettier con scripts npm,
# suite de tests (Vitest/Jest+coverage), Cypress E2E ni despliegue configurado en Render.
# Por ahora el gate es solo "instala y compila sin errores" en ambos paquetes. Cuando se
# agregue lint/tests/E2E/deploy real, ampliar este workflow siguiendo el patrón de
# 2026-2-ReactFS/.github/workflows/ci-cd.yml (lint -> test+coverage -> e2e -> deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    name: Install API (ecommerce-api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommerce-api/package-lock.json

      - run: npm ci

  build-app:
    name: Install + build App (ecommerce-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecommerce-app/package-lock.json

      - run: npm ci

      # CI=true hace que react-scripts trate los warnings de ESLint como errores.
      - name: Build de producción
        run: npm run build
        env:
          CI: true
